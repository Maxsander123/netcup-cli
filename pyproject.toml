[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "netcup-cli"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["click>=8.1", "requests>=2.31", "rich>=13.0", "jsonschema>=4.0"]

[project.scripts]
netcup-cli = "netcup_cli.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
